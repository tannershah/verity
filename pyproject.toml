[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verity"
version = "0.0.1"
description = "Epistemic transparency engine: claim -> load-bearing premises -> evidence -> per-premise confidence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "anthropic>=0.40",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# The local entailment scorer (M4). Kept out of the core dependencies so the test suite
# runs with no ML stack: the backends import torch inside their constructors, and
# `ScriptedScorer` needs neither. Installing this pulls ~5GB of checkpoints on first use.
verifier = [
    "torch>=2.2",
    "transformers>=4.40",
    "sentencepiece>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]
# Prose is not ours to reformat; ruff will otherwise rewrite fenced code blocks.
extend-exclude = ["docs", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `-rs` prints the reason for every skip. A test that skips silently is a silent cap:
# the model-layer integration test skips without the `verifier` extra installed, and a
# reader has to be able to see that it did.
# `-m "not live"` keeps the default suite offline and free: the retrieval tests run
# against committed fixtures, and only `pytest -m live` spends OpenAlex credits. A
# command-line `-m` overrides this one, which is what makes that opt-in work.
addopts = "-q -rs -m 'not live'"
markers = [
    "live: hits the real registries; opt in with `pytest -m live`",
]
